    <script type="text/javascript">
      // Corrige caminhos do PWA em subdiretórios (GitHub Pages) e rotas /secretaria, /aluno, etc.
      (function () {
        var known = ['contabil','accounting','secretaria','recepcao','financeiro','professor','aluno','orientacao','admin'];
        var segments = window.location.pathname.split('/').filter(Boolean);
        var base = '';
        if (segments.length > 0) {
          var first = segments[0].toLowerCase();
          if (known.indexOf(first) === -1 && first.indexOf('.') === -1) base = '/' + segments[0];
        }
        var set = function (id, file) {
          var el = document.getElementById(id);
          if (el) el.setAttribute('href', base + '/' + file);
        };
        set('tg-favicon', 'TGCCLOGO_1000x1000.png');
        set('tg-manifest', 'manifest.webmanifest');
        set('tg-apple-icon-192', 'TGCCLOGO_192x192.png');
        set('tg-apple-icon-1000', 'TGCCLOGO_1000x1000.png');
        set('tg-startup', 'TGCCLOGO_1000x1000.png');
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages URL decode script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
